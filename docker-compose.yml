services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: design-ai-ops:latest
    container_name: design-ai-ops
    restart: unless-stopped
    # 默认只对外暴露在本机 127.0.0.1，再用 Nginx 反代
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/data/dev.db"
      LLM_API_BASE_URL: "${LLM_API_BASE_URL:-https://api.openai.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      IMAGE_API_BASE_URL: "${IMAGE_API_BASE_URL:-https://api.openai.com/v1}"
      IMAGE_API_KEY: "${IMAGE_API_KEY:-}"
      IMAGE_MODEL: "${IMAGE_MODEL:-gpt-img-2}"
    volumes:
      - app_data:/data
      - app_uploads:/app/public/uploads
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "-q"
        - "http://127.0.0.1:3000/api/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1500m

volumes:
  app_data:
  app_uploads:
