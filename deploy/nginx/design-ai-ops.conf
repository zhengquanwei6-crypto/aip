# =============================================================
# Nginx 反向代理模板：design-ai-ops
# 路径：/etc/nginx/sites-available/design-ai-ops.conf
# 启用：ln -s /etc/nginx/sites-available/design-ai-ops.conf /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
# =============================================================

# ----- HTTP -> HTTPS 跳转 -----
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Let's Encrypt acme challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----- HTTPS 主站点 -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # ===== SSL 证书 =====
    # 用 certbot 后会自动填这里
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # ===== 安全头 =====
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ===== 个人内部工具 → 强烈建议加 Basic Auth =====
    # 1) sudo apt install apache2-utils
    # 2) sudo htpasswd -c /etc/nginx/.htpasswd-aip your-username
    # 3) 取消下面两行注释
    # auth_basic           "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd-aip;

    # ===== 上传 / 生图大小限制 =====
    client_max_body_size 25M;

    # ===== Next.js 静态资源缓存 =====
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ===== 其余请求转给 Next.js =====
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 接口可能比较慢
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
